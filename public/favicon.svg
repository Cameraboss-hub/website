<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CameraBoss">
  <!-- The red lens ring from the "O" of CAMERA BOSS. Measured from
       images/brand/cameraboss-logo.png: a true circle, 45px across with a 9px
       stroke, so the stroke is exactly 20% of the diameter. Colour #E61E23 is
       the dominant red in that file. -->
  <style>
    .plate { fill: #fafafa }
    @media (prefers-color-scheme: dark) { .plate { fill: #1a1a1a } }
  </style>
  <rect class="plate" width="64" height="64" rx="13"/>
  <circle cx="32" cy="32" r="20.8" fill="none" stroke="#E61E23" stroke-width="10.4"/>
</svg>
